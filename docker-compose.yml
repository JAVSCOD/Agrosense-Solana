services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - postgres-master

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  redis:
    image: redis:7
    container_name: agrosense-redis
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto
    container_name: agrosense-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  recepcion-sensores-1:
    build:
      context: ./services/recepcion-sensores
    container_name: recepcion-sensores-1
    depends_on:
      - redis
      - mosquitto
    environment:
      INSTANCE_ID: recepcion-sensores-1
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: agrosense/sensores
      REDIS_URL: redis://redis:6379

  recepcion-sensores-2:
    build:
      context: ./services/recepcion-sensores
    container_name: recepcion-sensores-2
    depends_on:
      - redis
      - mosquitto
    environment:
      INSTANCE_ID: recepcion-sensores-2
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: agrosense/sensores
      REDIS_URL: redis://redis:6379

  recepcion-sensores-3:
    build:
      context: ./services/recepcion-sensores
    container_name: recepcion-sensores-3
    depends_on:
      - redis
      - mosquitto
    environment:
      INSTANCE_ID: recepcion-sensores-3
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: agrosense/sensores
      REDIS_URL: redis://redis:6379

  zonas-agricolas:
    build:
      context: ./services/zonas-agricolas
    container_name: zonas-agricolas
    depends_on:
      - redis
      - prioridad-riego
    environment:
      REDIS_URL: redis://redis:6379
      GRPC_PRIORIDAD_URL: prioridad-riego:50051

  prioridad-riego:
    build:
      context: ./services/prioridad-riego
    container_name: prioridad-riego
    ports:
      - "50051:50051"
    depends_on:
      - redis
      - mosquitto
    environment:
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883

  historial-eventos:
    build:
      context: ./services/historial-eventos
    container_name: historial-eventos
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379

  notificaciones:
    build:
      context: ./services/notificaciones
    container_name: notificaciones
    ports:
      - "4000:4000"
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FRONTEND_URL: http://localhost:3000

  postgres-master:
    image: postgres:16
    container_name: agrosense-postgres-master
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agrosense
      POSTGRES_PASSWORD: agrosense123
      POSTGRES_DB: agrosense_db
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./postgres/master/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh

  postgres-replica:
    image: postgres:16
    container_name: agrosense-postgres-replica
    ports:
      - "5433:5432"
    depends_on:
      - postgres-master
    environment:
      PGPASSWORD: replicator123
    user: postgres
    command: >
      bash -c "
      until pg_isready -h postgres-master -p 5432; do
        echo 'Esperando postgres-master...';
        sleep 2;
      done;

      rm -rf /var/lib/postgresql/data/*;

      pg_basebackup -h postgres-master -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R;

      chmod 700 /var/lib/postgresql/data;

      exec postgres
      "
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data

  persistencia:
    build:
      context: ./services/persistencia
    container_name: persistencia
    depends_on:
      - redis
      - postgres-master
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_USER: agrosense
      POSTGRES_PASSWORD: agrosense123
      POSTGRES_DB: agrosense_db

volumes:
  postgres_master_data:
  postgres_replica_data:



